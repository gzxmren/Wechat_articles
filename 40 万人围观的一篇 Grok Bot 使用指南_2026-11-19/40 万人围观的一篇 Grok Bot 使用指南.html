            <html><body><div class="rich_media_content" id="js_content_wrapper" style="visibility: visible;"><div class="image_channel_desc" style="margin-bottom: 20px; font-size: 16px; line-height: 1.6; color: #333;">做 Grok Bot 的 @poteto 在 X 上发了一份自己的 bot 使用清单，浏览量超过 40 万，收藏数比点赞还多。我挑了最实用的几条做成图：bot 不用养太多，每个只干一件事；每教它一次，就让它写成 skill；能写成脚本的步骤，别让它每次亲手做，省 token；把工具接上，别再自己复制粘贴；像带实习生一样，先跟它讲清楚你是干什么的。作者最推荐的一招是用语音一口气说完，再让 bot 用自己的话复述一遍。完整解读和更多细节，在今天推送的长文里。</div><p><img src="assets/30c2a0f207f75bf27f5749a2de423356.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/fc98d9601612a4454305b80e3d4d5ad8.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/c2a0465fadd879eecf1a68d3f15f20d7.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/d71b2670d3e7002edeabfe3e235ae955.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/6e5e167bfe49eac52a5649ec66100d8c.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/e55c9614be1f7b2e2a3a96048b63976b.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/ab312f7766db8c6eff15f75214ba04b7.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/><p><img src="assets/2e4fcdab84fd37da9a0ba7ed0afe48ec.png" style="max-width: 100%; height: auto; display: block; margin: 0 auto;"/></p><br/></div></body></html>

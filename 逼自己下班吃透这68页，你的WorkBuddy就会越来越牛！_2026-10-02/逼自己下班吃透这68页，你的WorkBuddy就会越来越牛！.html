        <div class="content">
            <div class="rich_media_content js_underline_content autoTypeSetting24psection" id="js_content" style="visibility: visible; opacity: 1; "><p data-pm-slice="0 0 []"><strong><span leaf=""><span style="font-weight: normal" textstyle="">WorkBuddy是腾讯推出的桌面AI智能体，能直接操作电脑里的各类本地文件。写文档、做表格、生成PPT，或者做数据分析，都可以让它直接交付能用的成品。</span></span></strong></p><p><span leaf=""><span style="font-weight: normal" textstyle="">不过最近不少小伙伴反馈，用过之后觉得没那么顺手。我自己觉得，</span><span style="color: rgb(0, 82, 255); font-weight: normal; text-decoration: underline" textstyle="">要把WorkBuddy用好，除了安装skill，提示词怎么写也很关键。</span></span></p><p><strong><span leaf=""><span style="font-weight: normal" textstyle="">所以这次把这份68页的学习资料分享给大家，希望能帮大家把WorkBuddy用起来。下班后抽点时间，照着这68页的内容挨个动手练一遍，你也能用得很熟练。</span></span></strong></p><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-aistatus="1" data-imgfileid="100000332" data-ratio="1.3365539452495974" data-s="300,640" data-type="png" data-w="1242" src="assets/5a708d0ff9e38409cced0a3803d82d8b.png" type="block"/></section><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-aistatus="1" data-imgfileid="100000334" data-ratio="1.3365539452495974" data-s="300,640" data-type="png" data-w="1242" src="assets/3c8c99c567d36ce85fb0c2d52ac0e329.png" type="block"/></section><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-aistatus="1" data-imgfileid="100000333" data-ratio="1.3365539452495974" data-s="300,640" data-type="png" data-w="1242" src="assets/9671f3e1916a2fcf431f0f3977790459.png" type="block"/></section><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-aistatus="1" data-imgfileid="100000335" data-ratio="1.3365539452495974" data-s="300,640" data-type="png" data-w="1242" src="assets/516af53ba337c408996947a4d0cfcb6d.png" type="block"/></section><section nodeleaf="" style="text-align: center;"><img class="rich_pages wxw-img" data-aistatus="1" data-imgfil
